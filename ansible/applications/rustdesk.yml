- hosts: homelab
  become: true
  gather_facts: false

  vars:
    application: rustdesk
    host_directory: "{{ docker_data_root }}/{{ application }}"
    docker_network: "{{ application }}-net"
    local_backup_folder: "{{ application_data }}/{{ application }}"
    # Tagged with both upstream versions: the build skips when the image already
    # exists, so an untagged (:latest) name would never rebuild on a version bump.
    custom_image_name: "rustdesk-server-busybox:{{ app_versions['rustdesk']['image'] | regex_replace('^.*:', '') }}-bb{{ app_versions['busybox']['image'] | regex_replace('^.*:', '') }}"

  tasks:
    - name: Run only on the on the designated host
      block:
      - name: Ensure RustDesk data directory exists
        ansible.builtin.file:
          path: "{{ host_directory }}"
          state: directory
          mode: "0755"

      # GUARD: restore only into an empty target (no server key yet), so a routine
      # re-run never extracts the backup over the live keys + db_v2.sqlite3.
      - name: Check whether a live RustDesk key already exists (restore guard)
        ansible.builtin.stat:
          path: "{{ host_directory }}/id_ed25519"
        register: rustdesk_key

      - name: Refuse to deploy an empty RustDesk when no backup is staged
        ansible.builtin.fail:
          msg: >-
            {{ host_directory }} has no server key and no backup.tar.gz is staged in
            {{ local_backup_folder }}. Stage the backup and re-run, or pass
            -e allow_empty_deploy=true for a deliberate fresh install.
        when:
          - not rustdesk_key.stat.exists
          - (local_backup_folder + '/backup.tar.gz') is not file
          - not (allow_empty_deploy | default(false) | bool)

      - block:
        - name: Copy the archive to the remote machine
          ansible.builtin.copy:
            src: "{{ local_backup_folder }}/backup.tar.gz"
            dest: "/tmp"

        - name: Unzip file into the existing folder
          ansible.builtin.command: >
            tar -xzvf /tmp/backup.tar.gz -C {{ host_directory }}
          become: true
        when:
          - (local_backup_folder + '/backup.tar.gz') is file
          - not rustdesk_key.stat.exists

      - name: Бuild custom RustDesk image with busybox
        block:
          - name: Ensure build directory exists
            ansible.builtin.file:
              path: "/tmp/rustdesk-source"
              state: directory
              mode: '0755'

          - name: Create Dockerfile inline
            ansible.builtin.copy:
              dest: "/tmp/rustdesk-source/Dockerfile"
              content: |
                # Use the 'musl' or 'static' tag to ensure no external dependencies
                FROM {{ app_versions['busybox']['image'] }}-musl AS bb
                FROM {{ app_versions['rustdesk']['image'] }}

                # Copy the static binary
                COPY --from=bb /bin/busybox /bin/busybox
                
                # Since the binary is static
                RUN ["/bin/busybox", "--install", "-s", "/bin"]
              mode: '0644'

          - name: Build the RustDesk image 
            community.docker.docker_image:
              name: "{{ custom_image_name }}"
              source: build
              build:
                path: "/tmp/rustdesk-source"
                dockerfile: Dockerfile
                pull: true
                rm: true

      - name: Create RustDesk docker network
        community.docker.docker_network:
          name: "{{ docker_network }}"
          driver: bridge
          state: present

      - name: Run RustDesk relay (hbbr)
        community.docker.docker_container:
          name: rustdesk-hbbr
          image: "{{ custom_image_name }}"
          command: hbbr
          restart_policy: unless-stopped
          volumes:
            - "{{ host_directory }}:/root"
          ports:
            - "{{ application_services['rustdesk'].ports.relay }}:21117/tcp"
          networks:
            - name: "{{ docker_network }}"
          state: started

      - name: Run RustDesk rendezvous (hbbs)
        community.docker.docker_container:
          name: rustdesk-hbbs
          image: "{{ custom_image_name }}"
          command: hbbs
          restart_policy: unless-stopped
          volumes:
            - "{{ host_directory }}:/root"
          ports:
            - "{{ application_services['rustdesk'].ports.nat }}:21115/tcp"
            - "{{ application_services['rustdesk'].ports.hbbs }}:21116/tcp"
            - "{{ application_services['rustdesk'].ports.hbbs }}:21116/udp"
          networks:
            - name: "{{ docker_network }}"
          state: started
          
      when: inventory_hostname in application_services['rustdesk'].hosts