- hosts: homelab
  become: true 
  gather_facts: False
  vars:
    application: zigbee2mqtt
    host_directory: "{{ docker_data_root }}/{{ application }}"
    container_name: "{{ application }}"
    local_backup_folder: "{{ application_data }}/{{ application }}"

  tasks:
    - name: Run only on the on the designated host
      block:
      - name: Create directory
        file:
          path: "{{ item }}"
          state: directory
          mode: '0755'
        loop:
          - "{{ host_directory }}"
          - "{{ host_directory }}/data"

      # GUARD: restore only into an empty target (no configuration.yaml yet), so a
      # routine re-run never extracts the nightly backup over the live database.db
      # and configuration.yaml (devices paired since the last backup would be lost).
      - name: Check whether a live zigbee2mqtt config already exists (restore guard)
        ansible.builtin.stat:
          path: "{{ host_directory }}/data/configuration.yaml"
        register: z2m_config

      - name: Refuse to deploy an empty zigbee2mqtt when no backup is staged
        ansible.builtin.fail:
          msg: >-
            {{ host_directory }}/data has no configuration.yaml and no backup.tar.gz is
            staged in {{ local_backup_folder }}. Stage the backup and re-run, or pass
            -e allow_empty_deploy=true for a deliberate fresh install (new network!).
        when:
          - not z2m_config.stat.exists
          - (local_backup_folder + '/backup.tar.gz') is not file
          - not (allow_empty_deploy | default(false) | bool)

      - block:
        - name: Copy the backup archive to the remote machine
          ansible.builtin.copy:
            src: "{{ local_backup_folder }}/backup.tar.gz"
            dest: "/tmp"
        - name: Unzip file into the existing folder
          ansible.builtin.command: >
            tar -xzvf /tmp/backup.tar.gz -C {{ host_directory }}/data
          become: true
        when:
          - (local_backup_folder + '/backup.tar.gz') is file
          - not z2m_config.stat.exists

      - name: Run the container
        community.docker.docker_container:
          name: "{{ container_name }}"
          image: "{{ app_versions.zigbee2mqtt.image }}"
          detach: true
          ports:
            - "{{ application_services['zigbee2mqtt'].ports.web }}:8080"
          volumes:
            - "{{ host_directory }}/data:/app/data:Z"
          restart_policy: unless-stopped
          env:
            TZ: "Europe/Amsterdam"
            
      when: inventory_hostname in application_services['zigbee2mqtt'].hosts