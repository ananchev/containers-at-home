- hosts: homelab
  become: true 
  gather_facts: False
  vars:
    application: grafana
    host_directory: "{{ docker_data_root }}/{{ application }}"
    container_name: "{{ application }}"
    docker_network: influx-grafana
    local_backup_folder: "{{ application_data }}/{{ application }}"

  tasks:
    - name: Run only on the on the designated host
      block:
      - name: Create directory
        file:
          path: "{{ item }}"
          state: directory
          mode: '0755'
        loop:
          - "{{ host_directory }}"
          - "{{ host_directory }}/data"

      # GUARD: restore only into an empty target (no grafana.db yet), so a routine
      # re-run -- e.g. after a version bump -- never extracts the nightly backup over
      # live dashboards (an older backup over a migrated 12/13 database breaks it).
      - name: Check whether a live Grafana database already exists (restore guard)
        ansible.builtin.stat:
          path: "{{ host_directory }}/data/grafana.db"
        register: grafana_db_file

      - name: Refuse to deploy an empty Grafana when no backup is staged
        ansible.builtin.fail:
          msg: >-
            {{ host_directory }}/data has no grafana.db and no backup.tar.gz is staged
            in {{ local_backup_folder }}. Stage the backup and re-run, or pass
            -e allow_empty_deploy=true for a deliberate fresh install.
        when:
          - not grafana_db_file.stat.exists
          - (local_backup_folder + '/backup.tar.gz') is not file
          - not (allow_empty_deploy | default(false) | bool)

      - block:
        - name: Copy the archive to the remote machine
          ansible.builtin.copy:
            src: "{{ local_backup_folder }}/backup.tar.gz"
            dest: "/tmp"
        - name: Unzip file into the existing folder
          ansible.builtin.command: >
            tar -xzvf /tmp/backup.tar.gz -C {{ host_directory }}/data
          become: true

        - name: Change ownership recursively of the data directory
          ansible.builtin.file:
            path: "{{ host_directory }}/data"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            recurse: true
          become: true
        when:
          - (local_backup_folder + '/backup.tar.gz') is file
          - not grafana_db_file.stat.exists

      - name: Create the common network to use with grafana container
        community.docker.docker_network:
          name: "{{ docker_network }}"
          driver: bridge
          state: present

      - name: Run the container
        community.docker.docker_container:
          name: "{{ container_name }}"
          network_mode: "{{ docker_network }}"
          image: "{{ app_versions.grafana.image }}"
          detach: true
          user: "1001:"
          ports:
            - "{{ application_services['grafana'].ports.web }}:3000"
          volumes:
            - "{{ host_directory }}/data:/var/lib/grafana:Z"
          restart_policy: unless-stopped
          # no GF_INSTALL_PLUGINS: the dynamictext panel it installed was unused, and
          # plugin installs on start are a common failure point on major upgrades
      when: inventory_hostname in application_services['grafana'].hosts