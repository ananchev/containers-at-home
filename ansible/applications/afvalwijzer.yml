- hosts: homelab
  become: true 
  gather_facts: False
  vars:
    application: afvalwijzer
    host_directory: "{{ docker_data_root }}/{{ application }}"
    container_name: afvalwijzer
    selinux_files_to_label:
    - "{{ host_directory }}/afvalwijzer.log"
    - "{{ host_directory }}/source/telegram-send.conf"

  tasks:
    - name: Run only on the on the designated host
      block:
        - name: Create build directory
          file:
            path: "{{ host_directory }}"
            state: directory
            mode: '0755'
        
        - name: Clone the repository
          git:
              repo: 'https://github.com/ananchev/afvalwijzer.git' 
              dest: "{{ host_directory }}/source"

        # force: false -- only create if missing. Without this, every redeploy
        # would both wipe the log's history AND hit a real bug: once the
        # SELinux config step below has run once, this file carries a custom
        # afvalwijzer_t label, and ansible.builtin.copy's atomic_move tries to
        # preserve that context onto its temp file before renaming -- which
        # then fails chmod (Permission Denied) because the custom policy
        # doesn't grant that to a temp file sitting outside its expected path.
        - name: Initiate empty log file
          ansible.builtin.copy:
            content: ""
            dest: "{{ host_directory }}/afvalwijzer.log"
            mode: '0644'
            force: false

        # Removed first (rather than force: false above) because this one
        # DOES need fresh content every deploy -- once the SELinux config step
        # below has labeled it afvalwijzer_t, ansible.builtin.copy overwriting
        # it in place hits the same atomic_move/chmod bug explained above.
        # Deleting first means copy creates a fresh file (default type for
        # this path) instead of preserving the stale custom label.
        - name: Remove existing telegram-send.conf before rewriting
          ansible.builtin.file:
            path: "{{ host_directory }}/source/telegram-send.conf"
            state: absent

        - name: Create telegram-send.conf
          ansible.builtin.copy:
            content: |
                [telegram]
                token = {{ home_notifier_telegram_token }}
                chat_id = {{ home_notifier_telegram_chat_id }}
            dest: "{{ host_directory }}/source/telegram-send.conf"
            mode: '0644'

        - name: Configure SELinux
          ansible.builtin.include_tasks:
            file: ../_templates/configure_selinux.yml

        - name: Build the afvalwijzer image
          community.docker.docker_image:
            source: build
            build:
              path: "{{ host_directory }}/source"
              rm: true
            name: afvalwijzer:latest
            force_source: true

        - name: Cleanup the non-tagged images
          ansible.builtin.command: docker image prune -f

        - name: Run the container
          community.docker.docker_container:
            name: afvalwijzer
            detach: true
            network_mode: bridge
            image: afvalwijzer:latest
            env:
              URL: "{{ afvalwijzer_query_url }}"
              MQTT_SERVER: "{{ lan_addresses[application_services['mosquitto'].hosts[0]] }}"
              MQTT_TOPIC: garbage_collection
              TZ: Europe/Amsterdam
            mounts:
              - source: "{{ host_directory }}/afvalwijzer.log"
                target: /app/afvalwijzer.log
                type: bind
                read_only: no 
              - source: /etc/localtime
                target: /etc/localtime
                type: bind
                read_only: yes
            restart_policy: unless-stopped
      when: inventory_hostname in application_services['afvalwijzer'].hosts