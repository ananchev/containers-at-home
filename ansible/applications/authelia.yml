- hosts: homelab
  become: true 
  gather_facts: False
  vars:
    application: authelia
    docker_network: authelia-net
    local_backup_folder: "{{ application_data }}/{{ application }}"

  tasks:
    - name: Run only on the on the designated host
      block:  
      - name: Deploy the redis container
        block:
        - name: Set related variables (Redis)
          set_fact:
            container_name: authelia-redis

        - name: Create the common docker network
          community.docker.docker_network:
            name: "{{ docker_network }}"
            driver: bridge
            state: present

        # No host directory, SELinux labelling or dump.rdb restore for Redis: it keeps
        # its data in the named volume below (a dump copied to a host dir was never
        # loaded), and it only holds sessions -- users just log in again. The config +
        # db.sqlite3 restore below is what carries the real state.
        - name: Run the redis container
          community.docker.docker_container:
            name: "{{ container_name }}"
            hostname: authelia_redis_1
            detach: true
            network_mode: "{{ docker_network }}"
            image: "{{ app_versions['authelia-redis']['image'] }}"
            env:
              TZ: Europe/Amsterdam
            mounts:
              - source: "{{ container_name }}"
                target: /data
                read_only: no 
            expose:
              - "6379"
            restart_policy: unless-stopped

      - name: Deploy the authelia container
        block:

        - name: Set related variables (Authelia)
          set_fact:
            host_directory: "{{ docker_data_root }}/{{ application }}"
            container_name: authelia
            redis_container_name: authelia-redis
            redis_port: "6379"
            selinux_dirs_to_label: []
            selinux_files_to_label: [] 

        - name: Create host directories
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop: 
            - "{{ host_directory }}"
            - "{{ host_directory }}/config"

        # GUARD: restore only into an empty target (no configuration.yml yet), so a
        # routine re-run never extracts the backup over the live config + db.sqlite3.
        - name: Check whether a live Authelia config already exists (restore guard)
          ansible.builtin.stat:
            path: "{{ host_directory }}/config/configuration.yml"
          register: authelia_config

        - name: Refuse to deploy an empty Authelia when no backup is staged
          ansible.builtin.fail:
            msg: >-
              {{ host_directory }}/config is empty and no backup.tar.gz is staged in
              {{ local_backup_folder }}. Stage the backup and re-run, or pass
              -e allow_empty_deploy=true for a deliberate fresh install.
          when:
            - not authelia_config.stat.exists
            - (local_backup_folder + '/backup.tar.gz') is not file
            - not (allow_empty_deploy | default(false) | bool)

        - block:
          - name: Copy the archive to the remote machine
            ansible.builtin.copy:
              src: "{{ local_backup_folder }}/backup.tar.gz"
              dest: "/tmp"

          - name: Unzip file into the existing folder
            ansible.builtin.command: >
              tar -xzvf /tmp/backup.tar.gz -C {{ host_directory }}/config
            become: true
          when:
            - (local_backup_folder + '/backup.tar.gz') is file
            - not authelia_config.stat.exists

        - name: Restart chronyd service to ensure system clock gets properly synchronized
          ansible.builtin.service:
            name: chronyd
            state: restarted

        - name: Get details of the Redis container
          community.docker.docker_container_info:
            name: "{{ redis_container_name }}"
          register: redis_container_info

        - name: Make sure Redis is running
          wait_for:
            host: "{{ redis_container_info.container.NetworkSettings.Networks[docker_network].IPAddress }}"
            port: "{{ redis_port }}"
            state: started
            delay: 10
            timeout: 60
            sleep: 5

        - name: Run the authelia container
          community.docker.docker_container:
            name: "{{ container_name }}"
            detach: true
            network_mode: "{{ docker_network }}"
            image: "{{ app_versions['authelia']['image'] }}"
            env:
              TZ: Europe/Amsterdam
            ports:
              - "{{ application_services['authelia'].ports.web }}:9091"
            volumes:
              - "{{ host_directory }}/config:/config:Z"
            restart_policy: unless-stopped
      when: inventory_hostname in application_services['authelia'].hosts