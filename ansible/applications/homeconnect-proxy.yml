- hosts: homelab
  become: true 
  gather_facts: False
  vars:
    application: homeconnect-proxy
    host_directory: "{{ docker_data_root }}/{{ application }}"
    container_name: "{{ application }}"
    mount_access_mode: '0666'
    mount_access_owner: '65532' # owned by container's non-root user (uid 65532)
    mount_access_group: '65532' # owned by container's non-root group (uid 65532)
    selinux_allow_logrotate: true # host logrotate may rotate app.log (see logrotate task)
    selinux_files_to_label:
    - "{{ host_directory }}/token.cache"
    - "{{ host_directory }}/app.log"

  tasks:
    - name: Run only on the on the designated host
      block:
        - name: Create build directory
          file:
            path: "{{ host_directory }}"
            state: directory
            mode: '0755'

        - name: Clone the repository
          git:
              repo: 'https://github.com/ananchev/homeconnect-proxy.git' 
              dest: "{{ host_directory }}/source"

        - name: Initiate empty log file (only if missing)
          ansible.builtin.copy:
            content: ""
            force: false # create only - never truncate an existing log
            dest: "{{ host_directory }}/app.log"
            mode: "{{ mount_access_mode }}"
            owner: "{{ mount_access_owner }}"
            group: "{{ mount_access_owner }}"

        - name: Write dummy token file (only if missing) - updated upon first auth
          ansible.builtin.copy:
            content: |
              {
                "access_token":"",
                "expires_at":1729281641,
                "expires_in":86400,
                "id_token":"",
                "refresh_token":"",
                "scope":"IdentifyAppliance Control Settings Monitor",
                "token_type":"Bearer"
              }
            force: false # create only - never overwrite a live token with the dummy
            dest: "{{ host_directory }}/token.cache"
            mode: "{{ mount_access_mode }}"
            owner: "{{ mount_access_owner }}"
            group: "{{ mount_access_owner }}"

        - name: Configure SELinux
          ansible.builtin.include_tasks:
            file: ../_templates/configure_selinux.yml

        # The container keeps app.log open (bind mount), hence copytruncate.
        # Runs via the host's daily logrotate.timer; size is checked once a day.
        - name: Rotate app.log with logrotate
          ansible.builtin.copy:
            dest: /etc/logrotate.d/{{ application }}
            mode: '0644'
            content: |
              {{ host_directory }}/app.log {
                  size 50M
                  rotate 4
                  compress
                  missingok
                  notifempty
                  copytruncate
              }

        - name: Build the home-connect image 
          community.docker.docker_image:
            source: build
            build:
              path: "{{ host_directory }}/source"
              rm: true
            name: homeconnect-proxy:latest

        - name: Cleanup the non-tagged images
          ansible.builtin.command: docker image prune -f

        - name: Run the container
          community.docker.docker_container:
            name: homeconnect-proxy
            detach: true
            network_mode: bridge
            image: homeconnect-proxy:latest
            ports:
              - "{{ application_services['homeconnect-proxy'].ports.web }}:8088"
            env:
              CLIENT_ID: "{{ homeconnect_app_client_id }}"
              CLIENT_SECRET: "{{ homeconnect_app_client_secret }}"
              CLIENT_SCOPES: IdentifyAppliance%20Control%20Settings%20Monitor
              MQTT_HOST: "{{ lan_addresses[application_services['mosquitto'].hosts[0]] }}"
              MQTT_PORT: "{{ application_services['mosquitto'].ports.mqtt }}"
              TZ: Europe/Amsterdam
            mounts:
              - source: "{{ host_directory }}/app.log"
                target: /app.log
                type: bind
                read_only: no 
              - source: "{{ host_directory }}/token.cache"
                target: /token.cache
                type: bind
                read_only: no 
            restart_policy: unless-stopped
      when: inventory_hostname in application_services['homeconnect-proxy'].hosts