---
# Build the three from-source images. No force_source -> each SKIPS when already
# present (e.g. after a manual docker load on a constrained host). Context = repo ROOT
# for the two app images (shared docs_bridge package); Dockerfiles under images/.

# Both app Dockerfiles copy their models FROM the frozen models image (docs-bridge repo,
# images/models/Dockerfile) instead of exporting them at build. It can never be re-made
# (a re-export from current libraries gives different models), so the backup exports it
# every run (backups/backup_definitions.yml, step 4). On a host without it — a fresh or
# rebuilt one — stage that tar with the other restore archives in
# application_data/docs-bridge/ and this loads it; without the tar, fail early.
- name: Check the frozen models image is present
  ansible.builtin.command: "{{ container_runtime }} image exists {{ docs_bridge_models_image }}"
  register: db_models_image
  changed_when: false
  failed_when: false

- name: Copy the staged models archive to the host (only when the image is missing)
  ansible.builtin.copy:
    src: "{{ application_data }}/{{ application }}/{{ docs_bridge_models_tar }}"
    dest: "/tmp/{{ docs_bridge_models_tar }}"
    mode: '0644'
  when:
    - db_models_image.rc != 0
    - (application_data ~ '/' ~ application ~ '/' ~ docs_bridge_models_tar) is file
  register: db_models_copied

- name: Load the frozen models image from the staged archive
  ansible.builtin.command: "{{ container_runtime }} load -i /tmp/{{ docs_bridge_models_tar }}"
  when: db_models_copied is changed
  changed_when: true

- name: Remove the copied models archive
  ansible.builtin.file:
    path: "/tmp/{{ docs_bridge_models_tar }}"
    state: absent
  when: db_models_copied is changed

- name: Fail early without the frozen models image
  ansible.builtin.fail:
    msg: >-
      {{ docs_bridge_models_image }} is missing on {{ inventory_hostname }} and no
      {{ docs_bridge_models_tar }} is staged in {{ application_data }}/{{ application }}/.
      Take it from any docs-bridge backup folder (the backup exports it every run) and
      stage it there, then re-run. The app images build FROM it.
  when:
    - db_models_image.rc != 0
    - db_models_copied is not changed

- name: Build the ingest-worker image
  community.docker.docker_image:
    # Fully qualified (localhost/) so podman's enforcing short-name mode never sends a
    # `run` of this image down the pull path — see worker_image in the master playbook.
    name: "{{ worker_image }}"
    source: build
    force_source: "{{ rebuild_images | bool }}"   # -e rebuild_images=true after a code push
    build:
      path: "{{ source_path }}"
      dockerfile: images/ingest-worker/Dockerfile
      rm: true

- name: Build the docs-bridge server image
  community.docker.docker_image:
    name: "{{ server_image }}"
    source: build
    force_source: "{{ rebuild_images | bool }}"   # -e rebuild_images=true after a code push
    build:
      path: "{{ source_path }}"
      dockerfile: images/docs-bridge/Dockerfile
      rm: true

# From-source build (jemalloc for 16K pages — both the M2 and other aarch64 hosts need
# this). Only rebuilds when the image is absent, so redeploys skip it. Bumping the
# version in app_versions changes the tag -> next deploy rebuilds. Tagged as the
# upstream ref so diun watches qdrant/qdrant for new releases.
- name: Build the qdrant image (16K-page jemalloc, version from app_versions)
  community.docker.docker_image:
    name: "{{ qdrant_image }}"
    source: build
    build:
      path: "{{ source_path }}/images/qdrant"
      args:
        QDRANT_VERSION: "{{ qdrant_version }}"
        CARGO_BUILD_JOBS: "{{ host_tuning[inventory_hostname].cargo_build_jobs }}"
      rm: true

# Reclaim space: drop the multi-stage builder layers (the Rust target is several GB)
# and any leftover build containers.
- name: Prune dangling build images
  ansible.builtin.command: docker image prune -f
  changed_when: true

- name: Prune leftover build containers
  ansible.builtin.command: docker container prune -f
  changed_when: false
