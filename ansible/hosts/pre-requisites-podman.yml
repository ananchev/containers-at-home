# Podman runtime for RHEL-family hosts (Pi 5 Rocky 10, M2 + M1 Asahi Fedora: vhost2, vhost).
#
# The fleet drives every app with community.docker.* modules. Here we expose
# Podman through its Docker-API socket so those modules connect unchanged
# (design §3 / deployment-boundary memory):
#   podman + podman-docker  -> /run/docker.sock compatibility shim
#   podman.socket           -> the Docker-compatible API endpoint
#   podman-restart.service  -> reproduces `restart_policy: unless-stopped` on boot
#
# Run with:  ./run-playbook.sh pi5 hosts/pre-requisites-podman <key>   (see note below)
# or directly:  ansible-playbook -i inventories/pi5/hosts --private-key <key> \
#                 --ask-vault-pass hosts/pre-requisites-podman.yml
- hosts: homelab
  become: true
  gather_facts: false

  tasks:
    - name: Install Podman, the Docker-API shim, and tooling
      ansible.builtin.dnf:
        name:
          - podman
          - podman-docker                 # ships the /run/docker.sock shim + docker alias
          - python3-pip
          - python3-packaging             # ansible.builtin.pip needs it to parse versions
          - python3-setuptools            # pkg_resources for pip installs
          - policycoreutils-python-utils  # semodule/semanage (custom SELinux policy templates)
          - checkpolicy                   # checkmodule for compiling .te policy
          - git                           # build-context delivery / source clones
          - curl                          # Qdrant snapshot API (backup/restore)
        state: present

    - name: Install the Docker SDK for Python (community.docker driver)
      ansible.builtin.pip:
        name: docker
        state: present

    # Optionally relocate Podman's graphroot off the root filesystem. Hosts with a
    # tiny root + a big data volume (Pi 5: 30GB root, 446GB NVMe /data) MUST move
    # it so qdrant's from-source build layers don't overrun root. Hosts whose root
    # IS the big disk (M2 Asahi: the NVMe btrfs) skip this and keep Podman's native
    # /var/lib/containers/storage. Driven by the host fact `podman_graphroot`,
    # set in host_vars only where relocation is needed. (runroot stays on /run.)
    - name: Relocate Podman storage where a host requests it
      when: podman_graphroot is defined
      block:
        - name: Ensure the relocated Podman storage directory exists
          ansible.builtin.file:
            path: "{{ podman_graphroot }}"
            state: directory
            mode: '0700'

        - name: Point Podman's graphroot at the relocated path
          ansible.builtin.copy:
            dest: /etc/containers/storage.conf
            mode: '0644'
            content: |
              # Managed by Ansible (containers-at-home). Image/container storage
              # relocated off the small root onto a larger volume.
              [storage]
              driver = "overlay"
              runroot = "/run/containers/storage"
              graphroot = "{{ podman_graphroot }}"
          notify: restart podman socket

        - name: Add SELinux fcontext equivalence for the relocated graphroot
          ansible.builtin.command:
            cmd: semanage fcontext -a -e /var/lib/containers/storage {{ podman_graphroot }}
          register: sefcontext
          changed_when: sefcontext.rc == 0
          failed_when:
            - sefcontext.rc != 0
            - "'already defined' not in (sefcontext.stderr | default(''))"
          notify: restart podman socket

        - name: Apply SELinux labels to the relocated graphroot
          ansible.builtin.command: restorecon -R {{ podman_graphroot }}
          changed_when: false

    - name: Enable Podman's Docker-API socket
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    # Pick up the relocated graphroot before the smoke test below uses the socket.
    - name: Apply storage relocation now (restart socket if it changed)
      ansible.builtin.meta: flush_handlers

    # On a firewalld host (RHEL family) netavark leaves each container bridge in
    # the default zone (public), which DROPS the container->gateway :53 packets to
    # aardvark-dns. Container name resolution then fails with "Temporary failure in
    # name resolution" (EAI_AGAIN) even though aardvark holds the right records.
    # Trust Podman's container subnets so DNS (and inter-container traffic) flows:
    # 10.88.0.0/16 is the default network, 10.89.0.0/16 the pool for user-defined
    # networks. Runs at provisioning before any app network exists, so the reload
    # below cannot flush live netavark rules.
    - name: Detect whether firewalld is running
      ansible.builtin.command: firewall-cmd --state
      register: firewalld_state
      changed_when: false
      failed_when: false

    - name: Trust Podman container subnets in firewalld (container DNS via aardvark-dns)
      when: firewalld_state.stdout == "running"
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone=trusted --add-source={{ item }}"
      register: fw_trust
      changed_when: "'ALREADY_ENABLED' not in (fw_trust.stderr | default('')) and 'ALREADY_ENABLED' not in (fw_trust.stdout | default(''))"
      loop:
        - 10.88.0.0/16
        - 10.89.0.0/16
      notify: reload firewalld

    - name: Enable podman-restart (restores unless-stopped containers on boot)
      ansible.builtin.systemd:
        name: podman-restart.service
        enabled: true

    # Optional (host var `podman_require_mounts`, a list): don't start containers on
    # boot until these mounts are up. vhost: all bind mounts live on the USB-C
    # enclosure (nofail mount) - if it is missing, keep containers down instead of
    # starting them against empty directories on the internal disk.
    - name: Make podman-restart wait for the data mounts
      when: podman_require_mounts is defined
      block:
        - name: Ensure the podman-restart drop-in directory exists
          ansible.builtin.file:
            path: /etc/systemd/system/podman-restart.service.d
            state: directory
            mode: '0755'

        - name: Require the data mounts before podman-restart
          ansible.builtin.copy:
            dest: /etc/systemd/system/podman-restart.service.d/10-require-mounts.conf
            mode: '0644'
            content: |
              # Managed by Ansible (containers-at-home): containers start only once their data is mounted.
              [Unit]
              RequiresMountsFor={{ podman_require_mounts | join(' ') }}
          notify: reload systemd

    # Optional (host vars `podman_socket_group` + `podman_socket_users`): let these
    # users drive the ROOTFUL Podman socket without sudo (docker ps / podman ps),
    # like the docker group did. Root-equivalent, exactly as docker group membership.
    # CONTAINER_HOST makes their podman CLI (and the podman-docker `docker` wrapper)
    # a remote client of the rootful service instead of rootless podman.
    - name: Non-root access to the rootful Podman socket
      when: podman_socket_group is defined
      block:
        - name: Create the socket group
          ansible.builtin.group:
            name: "{{ podman_socket_group }}"
            system: true

        - name: Add the users to the socket group
          ansible.builtin.user:
            name: "{{ item }}"
            groups: "{{ podman_socket_group }}"
            append: true
          loop: "{{ podman_socket_users | default([]) }}"

        - name: Ensure the podman.socket drop-in directory exists
          ansible.builtin.file:
            path: /etc/systemd/system/podman.socket.d
            state: directory
            mode: '0755'

        - name: Hand the socket (and its directory) to the group
          ansible.builtin.copy:
            dest: /etc/systemd/system/podman.socket.d/10-group.conf
            mode: '0644'
            content: |
              # Managed by Ansible (containers-at-home)
              [Socket]
              SocketGroup={{ podman_socket_group }}
              SocketMode=0660
              DirectoryMode=0750
          notify: [reload systemd, restart podman socket]

        - name: Keep /run/podman traversable by the group (podman itself creates it 0700)
          ansible.builtin.copy:
            dest: /etc/tmpfiles.d/podman-socket-group.conf
            mode: '0644'
            content: |
              # Managed by Ansible (containers-at-home)
              z /run/podman 0750 root {{ podman_socket_group }} -

        - name: Point the group's podman CLI at the rootful socket
          ansible.builtin.copy:
            dest: /etc/profile.d/podman-remote.sh
            mode: '0644'
            content: |
              # Managed by Ansible (containers-at-home): members of {{ podman_socket_group }} talk to rootful podman.
              if [ "$(id -u)" -ne 0 ] && id -nG | grep -qw {{ podman_socket_group }}; then
                export CONTAINER_HOST=unix:///run/podman/podman.sock
              fi

        - name: Silence the podman-docker "Emulate Docker CLI" notice
          ansible.builtin.file:
            path: /etc/containers/nodocker
            state: touch
            mode: '0644'
            modification_time: preserve
            access_time: preserve

    - name: Apply systemd drop-ins before the socket is used
      ansible.builtin.meta: flush_handlers

    - name: Materialise the /run/docker.sock compatibility symlink now
      # podman-docker ships this as a tmpfiles.d entry; create it without a reboot
      # so community.docker can connect to unix://var/run/docker.sock immediately.
      ansible.builtin.command: systemd-tmpfiles --create
      changed_when: false

    - name: Confirm the Docker-compatible socket answers
      ansible.builtin.command: docker version
      changed_when: false

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart podman socket
      ansible.builtin.systemd:
        name: podman.socket
        state: restarted

    - name: reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
