backup_definitions:
  # docs-bridge: back up DERIVED state only (the corpus under /data/docs is
  # re-ingestable source, kept elsewhere). One readable script, three steps. Run
  # host-side because the data is on bind mounts and the ingest-worker is one-shot.
  # Restore is in the deploy playbook (snapshot upload API + manifest untar).
  #
  # docs_bridge_data_root below needs `| default('')`: ansible-core fully
  # renders this whole backup_definitions list (every host_commands string,
  # every item) before take_backups.yml's per-item `when` filters anything, so
  # hosts without this var defined (anything but vhost2) would otherwise crash
  # here even though this item never actually runs on them.
  - application: docs-bridge
    container: qdrant
    backup_commands: []
    copy_actions: []
    host_commands:
      - |
        set -e
        dest="{{ backups_directory }}/{{ backup_timestamp }}/docs-bridge"
        qdrant=http://127.0.0.1:6333

        # 1. One consistent snapshot per Qdrant collection (discovered live so this
        #    stays decoupled from app config): create, download, drop from the store.
        for name in $(curl -sf "$qdrant/collections" | python3 -c 'import json,sys; print(*[c["name"] for c in json.load(sys.stdin)["result"]["collections"]])'); do
          snap=$(curl -sf -X POST "$qdrant/collections/$name/snapshots" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["name"])')
          curl -sf "$qdrant/collections/$name/snapshots/$snap" -o "$dest/$name.snapshot"
          curl -sf -X DELETE "$qdrant/collections/$name/snapshots/$snap" >/dev/null
        done

        # 2. SQLite manifest (lets a restored host skip re-embedding).
        tar -czf "$dest/state.tar.gz" -C {{ docs_bridge_data_root | default('') }}/state .

        # 3. Index of the source docs (sha256<TAB>bytes<TAB>relpath) so a restored
        #    collection can be traced back to its files. The docs are not backed up.
        docs={{ docs_bridge_data_root | default('') }}/docs
        if [ -d "$docs" ]; then
          cd "$docs"
          find . -type f | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s\t%s\t%s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c '%s' "$f")" "${f#./}"
          done > "$dest/docs-manifest.tsv"
        fi

        # 4. The frozen model artifacts (docs-bridge repo images/models/Dockerfile):
        #    every localhost/docs-bridge-models:<tag> image, as a podman archive. Both
        #    app images are built FROM it, and it can never be re-made: re-exporting the
        #    models from current libraries gives DIFFERENT models than the ones every
        #    stored vector was embedded with. Saved fresh on every run: the target is a
        #    mirror (rsync -c, no --delete), so unchanged bytes cost no transfer and are
        #    stored once, while the new mtime keeps the file fresh — if the export ever
        #    stops (the image is gone), the tar goes stale and backup-audit's staleness
        #    check flags it. No marker file: in a mirror without --delete it would
        #    outlive the problem. Restore: the deploy loads a staged
        #    docs-bridge-models-<tag>.tar when the image is missing (images.yml).
        tags=$(podman image ls --noheading localhost/docs-bridge-models | awk '{print $2}')
        [ -n "$tags" ] || echo "WARNING: no localhost/docs-bridge-models image — models NOT backed up" >&2
        for tag in $tags; do
          podman save -o "$dest/docs-bridge-models-$tag.tar" "localhost/docs-bridge-models:$tag"
        done

  # docs-bridge stack, LibreChat side: the conversation/user DB is the only
  # must-back-up state (meili is a derived index; config is rendered from the repo).
  # Restored on a fresh deploy by applications/docs-bridge.yml.
  - application: docs-bridge
    container: librechat-mongodb
    backup_commands:
      - mongodump --db=LibreChat --archive=/tmp/librechat-mongo.archive --gzip
    copy_actions:
      - source_path: /tmp/librechat-mongo.archive
        target_filename: librechat-mongo.archive.gz

  - application: zigbee2mqtt
    container: zigbee2mqtt
    backup_commands:
      - tar -czf /tmp/backup.tar.gz -C /app/data .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz
  
  # guacamole stack torn down 2026-06-22, to be rebuilt later -- last backup
  # (2026-06-22) is deliberately kept on the ZFS mirror and excluded from the
  # backup-audit staleness check (see notes/containers-backup.md). Commented
  # out rather than left active because guacamole-postgres not existing makes
  # docker_container_exec hard-fail the whole host's remaining backup loop.
  # Re-enable once guacamole is redeployed.
  # - application: guacamole
  #   container: guacamole-postgres
  #   backup_commands:
  #     - pg_dumpall -U postgres --globals-only -f /tmp/postgres_globals.sql
  #     - pg_dump -U postgres -F p -f /tmp/guacamole_db.sql guacamole_db
  #   copy_actions:
  #     - source_path: /tmp/postgres_globals.sql
  #       target_filename: postgres_globals.sql
  #     - source_path: /tmp/guacamole_db.sql
  #       target_filename: guacamole_db.sql

  - application: authelia
    container: authelia
    backup_commands:
      - tar -czf /tmp/backup.tar.gz -C /config .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: authelia
    container: authelia-redis
    backup_commands:
      - redis-cli save
    copy_actions:
      - source_path: /data/dump.rdb
        target_filename: dump.rdb

  - application: grafana
    container: grafana
    backup_commands:
      - tar -czf /tmp/backup.tar.gz -C /var/lib/grafana .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: influxdb
    container: influxdb
    backup_commands:
      # since 1.11 the image runs as influxdb (uid 1500), which can't remove a
      # top-level /backup (parent / is root-owned) — stage under /tmp instead
      - rm -rf /tmp/influx-backup
      - influxd backup -portable /tmp/influx-backup
      - tar -czf /tmp/backup.tar.gz -C /tmp/influx-backup .
      # podman cp can't read the SELinux-labelled bind-mounted conf (permission
      # denied → copy_actions' touch leaves a 0-byte file); stage it in-container
      - cp /etc/influxdb/influxdb.conf /tmp/influx-backup/influxdb.conf
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz
      - source_path: /tmp/influx-backup/influxdb.conf
        target_filename: influxdb.conf

  - application: mosquitto
    container: mosquitto
    backup_commands: []
    copy_actions:
      - source_path: /mosquitto/data/mosquitto.db
        target_filename: mosquitto.db

  # Below is commented out as currently motioneye is not used
  # - application: motioneye
  #   container: motioneye
  #   backup_commands:
  #     - >
  #       tar
  #       --exclude="source"
  #       --exclude="docker-*"
  #       --exclude="backup.tar.gz"
  #       --exclude="Dockerfile"
  #       -czf /tmp/backup.tar.gz -C /etc/motioneye .
  #   copy_actions:
  #     - source_path: /tmp/backup.tar.gz
  #       target_filename: backup.tar.gz

  - application: nginx-proxy-manager
    container: nginx-proxy-manager
    backup_commands:
      - tar -czf /tmp/backup.tar.gz /data
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: openhab
    container: openhab
    backup_commands:
      - >
       tar --verbose
            --exclude="userdata/backup"
            --exclude="userdata/tmp"
            --exclude="userdata/cache"
            --exclude="userdata/logs"
            -czf /tmp/backup.tar.gz
            -C /openhab/userdata/.. userdata
            -C /openhab/conf/.. conf
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: passbolt
    container: mariadb-passbolt
    backup_commands:
      - mariadb-dump -u {{ passbolt_mysql_user }} -p{{ passbolt_mysql_pass }} {{ passbolt_mysql_db }} --result-file=/tmp/db_backup.sql
      - cp /etc/mysql/conf.d/99-replication.cnf /tmp/99-replication.cnf
    copy_actions:
      - source_path: /tmp/db_backup.sql
        target_filename: db_backup.sql
      - source_path: /tmp/99-replication.cnf
        target_filename: 99-replication.cnf

  - application: passbolt
    container: passbolt
    backup_commands:
      - mkdir -p /tmp/backup/cert /tmp/backup/gpg
      - cp /etc/ssl/certs/certificate.crt /tmp/backup/cert/
      - cp /etc/ssl/certs/certificate.key /tmp/backup/cert/
      - cp /etc/passbolt/gpg/serverkey.asc /tmp/backup/gpg/
      - cp /etc/passbolt/gpg/serverkey_private.asc /tmp/backup/gpg/
      - tar -czvf /tmp/backup.tar.gz -C /tmp backup
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: memos
    container: memos-postgres
    backup_commands:
      - pg_dumpall -U postgres --globals-only -f /tmp/postgres_globals.sql
      - pg_dump -U postgres -F p -f /tmp/memos.sql memos
    copy_actions:
      - source_path: /tmp/postgres_globals.sql
        target_filename: postgres_globals.sql
      - source_path: /tmp/memos.sql
        target_filename: memos.sql

  # memos attachments (LOCAL storage, ~100M of png/jpg/pdf). Archived on the host:
  # the memos image only ships busybox tar. Already-compressed media, so xz buys
  # little; gzip --rsyncable keeps the archive borg-dedupable night to night.
  # filestore_root needs `| default('')` for the same reason as docs_bridge_data_root
  # (top of file): only unraid/vhost define it; pi5 crashed on it 2026-11-18.
  - application: memos
    container: memos
    backup_commands: []
    host_commands:
      - >-
        set -o pipefail;
        tar -C {{ filestore_root | default('') }}/memos --numeric-owner -cf - . | gzip -n --rsyncable
        > "{{ backups_directory }}/{{ backup_timestamp }}/memos/attachments.tar.gz"
    copy_actions: []

  - application: rustdesk
    container: rustdesk-hbbr
    backup_commands:
      - mkdir -p /tmp
      - tar -czf /tmp/backup.tar.gz -C /root .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: arr-stack
    container: radarr
    backup_commands:
      - >
        tar --exclude='./logs'
            --exclude='./MediaCover'
            -czf /tmp/backup.tar.gz
            -C /config .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: radarr-backup.tar.gz

  - application: arr-stack
    container: sonarr
    backup_commands:
      - >
        tar --exclude='./logs'
            --exclude='./MediaCover'
            -czf /tmp/backup.tar.gz
            -C /config .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: sonarr-backup.tar.gz

  - application: arr-stack
    container: bazarr
    backup_commands:
      - >
        tar --exclude='./log'
            --exclude='./cache'
            -czf /tmp/backup.tar.gz
            -C /config .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: bazarr-backup.tar.gz

  - application: jellyfin
    container: jellyfin
    backup_commands:
      - mkdir -p /tmp
      # plain tar + gzip --rsyncable (GNU gzip in this image): a normal gzip stream
      # changes completely every night, which defeats borg dedup (~830M/day new chunks)
      - tar --exclude='/config/log' -cf /tmp/backup.tar /config /data
      - gzip -f --rsyncable /tmp/backup.tar
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  # Frigate NVR (unas): /config only - config.yml (zones/masks/settings edited in the UI),
  # frigate.db (events, review items, users) and the .jwt_secret auth key. frigate.db is
  # copied with sqlite's online backup API (consistent while Frigate writes; a plain tar of
  # the live WAL db is not). model_cache is excluded from the tar; the YOLOv9 export is
  # copied as its own file instead, so its unchanged bytes are stored once in the mirror
  # (rsync -c) and a restore skips the ~10 min rebuild. Recordings on the USB disk are
  # NOT backed up (rolling buffer). frigate-notify is stateless (config rendered from repo).
  # Restore: applications/frigate.yml (restore-only-into-empty-target guard).
  # The model is copied host-side by glob, not via copy_actions: a docker cp of a missing
  # file hard-fails the host's whole remaining backup loop (see guacamole note above).
  # docker_data_root needs `| default('')`: this list is rendered on every host (see the
  # docs-bridge note at the top), not only on unas.
  - application: frigate
    container: frigate
    backup_commands:
      - python3 -c "import sqlite3; d = sqlite3.connect('/tmp/frigate.db'); sqlite3.connect('/config/frigate.db').backup(d); d.close()"
      - >
        tar -czf /tmp/backup.tar.gz
          --exclude=./model_cache
          --exclude=./frigate.db
          --exclude=./frigate.db-wal
          --exclude=./frigate.db-shm
          -C /config .
          -C /tmp frigate.db
      - rm -f /tmp/frigate.db
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz
    host_commands:
      - |
        dest="{{ backups_directory }}/{{ backup_timestamp }}/frigate"
        found=0
        for f in {{ docker_data_root | default('') }}/frigate/config/model_cache/yolov9-*.onnx; do
          [ -f "$f" ] || continue
          cp "$f" "$dest/" && found=1
        done
        [ "$found" = 1 ] || echo "WARNING: no YOLOv9 .onnx in frigate model_cache - model NOT backed up" >&2

  - application: borg-ui
    container: borg-ui
    backup_commands:
      - >
        tar -czf /tmp/backup.tar.gz
            -C /data borg.db
            -C /data borg_keys
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: immich
    container: immich-postgres
    backup_commands:
      - pg_dump --clean --if-exists --dbname={{ immich_db_database }} --username={{ immich_db_username }} -f /tmp/immich_db.sql
      # --rsyncable keeps the gzip stream borg-dedupable night to night
      - gzip -f --rsyncable /tmp/immich_db.sql
    copy_actions:
      - source_path: /tmp/immich_db.sql.gz
        target_filename: immich_db.sql.gz

  - application: immich
    container: immich-server
    backup_commands: []
    host_commands:
      - >-
        rsync -av --delete
        -e "ssh -i /home/{{ ansible_user }}/.ssh/immich_backup_key -o StrictHostKeyChecking=no"
        {{ docker_data_root }}/immich/media/
        {{ backup_user }}@{{ large_backups_host }}:{{ large_backups_location }}/immich
        > /tmp/immich_rsync.log 2>&1
    copy_actions: []

  - application: nextcloud
    container: nextcloud-postgres
    backup_commands:
      - pg_dump --clean --if-exists --dbname=nextcloud --username=nextcloud -f /tmp/nextcloud_db.sql
      - gzip -f /tmp/nextcloud_db.sql
    copy_actions:
      - source_path: /tmp/nextcloud_db.sql.gz
        target_filename: nextcloud_db.sql.gz

  - application: nextcloud
    container: nextcloud-app
    backup_commands:
      - tar -czf /tmp/backup.tar.gz -C /var/www/html config custom_apps
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz
    host_commands:
      - >-
        rsync -av --delete
        -e "ssh -i /home/{{ ansible_user }}/.ssh/nextcloud_backup_key -o StrictHostKeyChecking=no"
        {{ docker_data_root }}/nextcloud/data/
        {{ backup_user }}@{{ large_backups_host }}:{{ large_backups_location }}/nextcloud
        > /tmp/nextcloud_rsync.log 2>&1

  - application: caddy
    container: caddy
    backup_commands:
      - mkdir -p /tmp/caddy-backup
      - cp -r /etc/caddy/sites /tmp/caddy-backup/
      - cp -r /certs /tmp/caddy-backup/
      - cp -r /data /tmp/caddy-backup/
      - cp -r /config /tmp/caddy-backup/
      - tar -czf /tmp/backup.tar.gz -C /tmp/caddy-backup .
      - rm -rf /tmp/caddy-backup
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: cycling-stack
    container: cycling-coach
    backup_commands:
      - >
        tar -czvf /tmp/backup.tar.gz
          --exclude="fit_files/source"
          -C /data
          athlete-profile.md
          cycling.db
          cycling.db-wal
          cycling.db-shm
          fit_files
          prompts
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: backup.tar.gz

  - application: cycling-stack
    container: mcp-auth-server
    backup_commands: []
    copy_actions:
      - source_path: /data/refresh.json
        target_filename: refresh.json
    host_commands:
      - >-
        cd "{{ backups_directory }}/{{ backup_timestamp }}/cycling-stack"
        && tar -czf mcp-auth-backup.tar.gz refresh.json
        && rm -f refresh.json

  - application: cycling-stack
    container: healthbridge-backend
    backup_commands:
      - tar -czf /tmp/backup.tar.gz -C /data .
    copy_actions:
      - source_path: /tmp/backup.tar.gz
        target_filename: healthbridge-backup.tar.gz

  # Homepage is stateless except bookmarks.yaml (hand-edited live on the host).
  # Copy just that file out of the container so a rebuild keeps the links;
  # everything else is regenerated from the registry.
  - application: homepage
    container: homepage
    backup_commands: []
    copy_actions:
      - source_path: /app/config/bookmarks.yaml
        target_filename: bookmarks.yaml
